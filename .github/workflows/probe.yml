name: probe FSIS access
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: try several addresses and agents
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36'
          for u in "https://www.fsis.usda.gov/fsis/api/recall/v/1" "https://www.fsis.usda.gov/fsis-content/rss/recalls.xml" "https://www.fsis.usda.gov/recalls" "https://www.foodsafety.gov/recalls-and-outbreaks" "https://www.recalls.gov/" "https://www.fsis.usda.gov/"; do
            printf "%s -> " "$u"
            curl -s -o /tmp/o -w "%{http_code} %{size_download}B\n" -m 40 -A "$UA" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" -H "Upgrade-Insecure-Requests: 1" "$u" || echo "curl error"
          done
          echo "== python urllib"; python3 - <<'PY'
          import urllib.request
          req=urllib.request.Request("https://www.fsis.usda.gov/fsis/api/recall/v/1", headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36","Accept":"*/*"})
          try:
              r=urllib.request.urlopen(req, timeout=40); print("python", r.status, len(r.read()))
          except Exception as e: print("python", e)
          PY
